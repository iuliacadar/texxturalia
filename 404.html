<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | The thread has snapped | Texxturalia</title>

    <!-- Favicon & CSS (direct paths from root) -->
    <link rel="icon" type="image/x-icon" href="images/branding/favicon.ico" />
    <link rel="stylesheet" href="style.css" />

    <!-- Full Google Fonts setup (essential for the aesthetic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Montserrat:wght@100;200&display=swap"
    />
  </head>
  <body class="error-page">
    <main class="error-container">
      <div class="error-content reveal">
        <h1 class="error-title">404</h1>
        <!--
          BILINGUAL MESSAGE HIERARCHY (why EN sits above RO, and looks
          more prominent):
          The English message (.error-message-en) is styled with higher
          opacity than the Romanian one (.error-message-ro) — see
          style.css GROUP 12. This is a deliberate hierarchy, not an
          oversight: the site's primary audience is English-speaking (the
          root of the site is English, the /ro/ folder is a mirror — see
          docs/DECISIONS.md, "Bilingual by mirroring, not i18n tooling"),
          so the EN line carries the primary content at full clarity. The
          dimmer RO line underneath is a nod to the project's bilingual
          strategy: it doesn't compete with the EN message for attention,
          but it's there, in the visitor's own language if they're
          Romanian-speaking, inviting them into the same experience rather
          than leaving them without any acknowledgment at all.
        -->
        <p class="error-message-en">
          The thread has snapped. Return to the abyss.
        </p>
        <p class="error-message-ro">
          Firul s-a rupt. Întoarce-te în abis.
        </p>

        <div class="error-action">
          <a href="index.html" class="btn-back"
            >RETURN TO SOURCE / RECONSTRUCȚIE</a
          >
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
